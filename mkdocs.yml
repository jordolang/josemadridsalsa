site_name: 'Jose Madrid Salsa Documentation'
site_description: 'Technical documentation for Jose Madrid Salsa e-commerce platform'
site_author: 'Jose Madrid Salsa Team'

repo_url: https://github.com/jordolang/josemadridsalsa
repo_name: josemadridsalsa
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: red
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - techdocs-core

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
    - Environment Setup: env-setup.md
    - Admin Login Guide: ADMIN_LOGIN_GUIDE.md
  - Features:
    - Admin Panel: admin-panel-complete.md
    - Products Module: PRODUCTS_MODULE_COMPLETE.md
    - Tags System: TAGS_SYSTEM_COMPLETE.md
    - Password Reset: PASSWORD_RESET_FEATURE.md
    - Image Management: IMAGE_MANAGEMENT.md
  - Integrations:
    - Stripe Webhooks: STRIPE_WEBHOOK_SETUP.md
    - Google Calendar: google-calendar-setup.md
    - Google Places: google-places-setup.md
    - Google Reviews: GOOGLE_REVIEWS_SETUP.md
  - Development:
    - Project Status: PROJECT_STATUS.md
    - Phase 0 Complete: PHASE_0_COMPLETE.md
    - Phase 1 Complete: PHASE_1_COMPLETE.md
    - Phase 2 Complete: phase2-complete.md
    - Phase 3 Complete: phase3-complete.md
    - Phase 4 Complete: phase4-complete.md
  - Automation:
    - Next Steps: NEXT_STEPS_AUTOMATION.md
  - Session Summaries:
    - Final Summary: FINAL_SESSION_SUMMARY.md
    - 3 Modules Summary: SESSION_SUMMARY_3_MODULES.md
