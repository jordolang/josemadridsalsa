  annotations:
    github.com/project-slug: jordolang/josemadridsalsa
  tags:
    - react
    - account
    - user-management
    - authentication
    - nextauth
  links:
    - url: http://localhost:3000/account
      title: Account Page (Local)
      icon: user
spec:
  type: library
  lifecycle: production
  owner: user:default/jordolang
  system: josemadridsalsa
  subcomponentOf: component:default/josemadridsalsa-web
  dependsOn:
