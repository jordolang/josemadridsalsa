apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: josemadridsalsa-store-components
  title: Jose Madrid Salsa Storefront Components
  description: Customer-facing e-commerce components including product display, cart management, checkout flow, navigation, and product browsing features
  annotations:
    github.com/project-slug: jordolang/josemadridsalsa
  tags:
    - react
    - ecommerce
    - storefront
    - product-catalog
    - cart
  links:
    - url: http://localhost:3000/salsas
      title: Store Page (Local)
      icon: web
spec:
  type: library
  lifecycle: production
  owner: user:default/jordolang
  system: josemadridsalsa
  subcomponentOf: component:default/josemadridsalsa-web
  dependsOn:
    - component:default/josemadridsalsa-ui-library
    - resource:default/josemadridsalsa-database
  consumesApis:
    - josemadridsalsa-api
