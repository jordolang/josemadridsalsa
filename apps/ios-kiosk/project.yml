# Jose Madrid Kiosk for iPad. The Xcode project is generated from this file:
#   brew install xcodegen && cd apps/ios-kiosk && xcodegen generate
#
# Build and install (needs full Xcode, not just the Command Line Tools):
#   1. cp Config/Signing.example.xcconfig Config/Signing.xcconfig, set DEVELOPMENT_TEAM to your
#      Apple Developer Team ID (developer.apple.com > Account > Membership details).
#   2. Xcode > Settings > Accounts: sign in with that Apple ID.
#   3. On the iPad: Settings > Privacy & Security > Developer Mode > On (restart), then connect
#      it by USB-C/Lightning and tap "Trust".
#   4. open JoseMadridKiosk.xcodeproj, pick the iPad as the run destination, press Run. Automatic
#      signing registers the iPad and creates the provisioning profile.
#      Or from the terminal:
#        xcodebuild -project JoseMadridKiosk.xcodeproj -scheme JoseMadridKiosk \
#          -destination 'generic/platform=iOS' -allowProvisioningUpdates -allowProvisioningDeviceRegistration build
#        xcrun devicectl device install app --device <iPad UDID> \
#          build/.../Release-iphoneos/JoseMadridKiosk.app
#   5. Lock it down with Guided Access (see the comment at the top of Kiosk/KioskApp.swift).
# Tests: xcodebuild test -project JoseMadridKiosk.xcodeproj -scheme JoseMadridKiosk \
#          -destination 'platform=iOS Simulator,name=iPad (10th generation)'

name: JoseMadridKiosk
options:
  bundleIdPrefix: net.josemadrid
  deploymentTarget:
    # Square's Mobile Payments SDK needs iOS 17.1.
    iOS: "17.1"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  StarIO10:
    url: https://github.com/star-micronics/StarXpand-SDK-iOS
    exactVersion: 2.9.0
  # Card payments on a Bluetooth Square Reader. MockReaderUI is a simulated reader for
  # Square's sandbox; the app only shows it when signed in to a sandbox account.
  SquareMobilePaymentsSDK:
    url: https://github.com/square/mobile-payments-sdk-ios
    exactVersion: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  JoseMadridKiosk:
    type: application
    platform: iOS
    sources: [Kiosk]
    dependencies:
      - package: StarIO10
      - package: SquareMobilePaymentsSDK
        product: SquareMobilePaymentsSDK
      - package: SquareMobilePaymentsSDK
        product: MockReaderUI
    # Square's SDK must run its setup script as the last build phase, outside the
    # script sandbox (ENABLE_USER_SCRIPT_SANDBOXING below).
    postBuildScripts:
      - name: Square Mobile Payments SDK setup
        script: |
          SETUP="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/SquareMobilePaymentsSDK.framework/setup"
          if [ -x "$SETUP" ]; then "$SETUP"; else echo "warning: $SETUP not found"; fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: JoseMadridKiosk
        PRODUCT_BUNDLE_IDENTIFIER: net.josemadrid.kiosk
        INFOPLIST_FILE: Kiosk/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Square's application id. Not a secret; it identifies the app to Square. Set
        # SQUARE_APPLICATION_ID_OVERRIDE in Config/Signing.xcconfig to use a sandbox app instead.
        SQUARE_APPLICATION_ID: $(SQUARE_APPLICATION_ID_OVERRIDE:default=sq0idp-yOtCWDhACLrw1cjKHPNFNA)

  JoseMadridKioskTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KioskTests]
    dependencies:
      - target: JoseMadridKiosk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: net.josemadrid.kiosk.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/JoseMadridKiosk.app/JoseMadridKiosk
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  JoseMadridKiosk:
    build:
      targets:
        JoseMadridKiosk: all
        JoseMadridKioskTests: [test]
    test:
      targets: [JoseMadridKioskTests]
