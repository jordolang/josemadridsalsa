# Dependabot version update configuration
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Policy: security updates only for npm; grouped minor/patch for GH Actions.
# Major bumps are handled manually to avoid surprise breaking changes.

version: 2
updates:
  # npm / Node.js — security patches only, grouped into a single PR
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 3
    # Only open PRs for known security vulnerabilities
    versioning-strategy: increase
    groups:
      security-patches:
        applies-to: security-updates
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'security'
    # Block all version updates — we only want security alerts
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'

  # GitHub Actions — minor/patch only, grouped into one PR
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'github-actions'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
