name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Codex Review
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        (
          contains(github.event.comment.body, '@codex') ||
          contains(github.event.comment.body, '@Codex') ||
          contains(github.event.comment.body, '@CODEX')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number
            if (!prNumber) {
              core.setFailed('Unable to determine pull request number.')
              return
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            core.setOutput('number', String(pr.number))
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('base_ref', pr.base.ref)
            core.setOutput('title', pr.title ?? '')
            core.setOutput('body', pr.body ?? '')
            core.setOutput('author', pr.user?.login ?? '')
            core.setOutput('base_label', pr.base.label)
            core.setOutput('head_label', pr.head.label)

      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run type-check
        id: typecheck
        run: npm run type-check
        continue-on-error: true

      - name: Codex review summary
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login || '' }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPE_OUTCOME: ${{ steps.typecheck.outcome }}
        with:
          script: |
            const marker = '<!-- codex-review -->'
            const prNumber = Number(process.env.PR_NUMBER)
            if (!prNumber) {
              core.setFailed('Missing PR number for Codex review.')
              return
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            })

            const directories = new Map()
            for (const file of files) {
              const dir = file.filename.includes('/') ? file.filename.split('/')[0] : '(root)'
              directories.set(dir, (directories.get(dir) || 0) + 1)
            }

            const impactedAreas = directories.size
              ? Array.from(directories.entries())
                  .sort((a, b) => b[1] - a[1])
                  .slice(0, 10)
                  .map(([dir, count]) => `- \`${dir}\` · ${count} file${count === 1 ? '' : 's'}`)
                  .join('\n')
              : '_No file changes detected._'

            const intent = (pr.body || '').trim()
            const snippet = intent
              ? intent
                  .split('\n')
                  .filter(Boolean)
                  .slice(0, 6)
                  .join('\n')
                  .slice(0, 600)
              : ''
            const intentBlock = intent
              ? snippet
                  .split('\n')
                  .map((line) => `> ${line}`)
                  .join('\n')
              : '_No intent provided in the PR description._'

            const lowerIntent = intent.toLowerCase()
            const missingCoverage = intent
              ? Array.from(directories.keys())
                  .filter((dir) => dir !== '(root)')
                  .filter((dir) => !lowerIntent.includes(dir.toLowerCase()))
              : []

            let coverageSection = ''
            if (!intent) {
              coverageSection =
                'PR description is empty, so Codex cannot compare the stated intent to the implementation.'
            } else if (missingCoverage.length === 0) {
              coverageSection = 'Intent references the major impacted areas ✅'
            } else {
              coverageSection = `Intent never mentions: ${missingCoverage
                .map((dir) => `\`${dir}\``)
                .join(', ')}. Consider updating the description for reviewers.`
            }

            const formatOutcome = (name, value) => {
              if (value === 'success') return `| ${name} | ✅ Passed |`
              if (value === 'failure') return `| ${name} | ❌ Failed — see workflow logs |`
              if (value === 'cancelled') return `| ${name} | ⚠️ Cancelled |`
              return `| ${name} | ⚠️ Not run |`
            }

            const lintRow = formatOutcome('npm run lint', process.env.LINT_OUTCOME)
            const typeRow = formatOutcome('npm run type-check', process.env.TYPE_OUTCOME)

            const trigger =
              process.env.EVENT_NAME === 'issue_comment'
                ? `Manual review requested by @${process.env.COMMENT_AUTHOR || 'unknown'}`
                : `Automatic review on \`${process.env.EVENT_ACTION || 'pull_request'}\``

            const body = `${marker}
            ## 🤖 Codex Review
            **Trigger:** ${trigger}
            **Author:** @${pr.user?.login}

            ### Intent
            ${intentBlock}

            ### Change Summary
            - ${pr.changed_files} files touched (${pr.additions} additions / ${pr.deletions} deletions)
            - Base → Head: \`${pr.base.label}\` ➜ \`${pr.head.label}\`

            ### Impacted Areas
            ${impactedAreas}

            ### Intent vs. Changes
            ${coverageSection}

            ### Automated Checks
            | Check | Result |
            | --- | --- |
            ${lintRow}
            ${typeRow}

            _Reply with \`@codex\` after pushing new commits to queue another review._`
              .replace(/^[ \t]+/gm, '')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            })

            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }

            if (process.env.LINT_OUTCOME === 'failure' || process.env.TYPE_OUTCOME === 'failure') {
              core.setFailed('One or more automated checks failed. See Codex review comment for details.')
            }
