name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    name: Codex Review
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        (
          contains(github.event.comment.body, '@codex') ||
          contains(github.event.comment.body, '@Codex') ||
          contains(github.event.comment.body, '@CODEX')
        )
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number
            if (!prNumber) {
              core.setFailed('Unable to determine pull request number.')
              return
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            core.setOutput('number', String(pr.number))
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('base_ref', pr.base.ref)
            core.setOutput('title', pr.title ?? '')
            core.setOutput('body', pr.body ?? '')
            core.setOutput('author', pr.user?.login ?? '')
            core.setOutput('base_label', pr.base.label)
            core.setOutput('head_label', pr.head.label)

      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Codex review summary
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login || '' }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const marker = '<!-- codex-review -->'
            const prNumber = Number(process.env.PR_NUMBER)
            if (!prNumber) {
              core.setFailed('Missing PR number for Codex review.')
              return
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            })

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            })

            const directories = new Map()
            for (const file of files) {
              const dir = file.filename.includes('/') ? file.filename.split('/')[0] : '(root)'
              directories.set(dir, (directories.get(dir) || 0) + 1)
            }

            const impactedAreas = directories.size
              ? Array.from(directories.entries())
                  .sort((a, b) => b[1] - a[1])
                  .slice(0, 10)
                  .map(([dir, count]) => `- \`${dir}\` · ${count} file${count === 1 ? '' : 's'}`)
                  .join('\n')
              : '_No file changes detected._'

            const intent = (pr.body || '').trim()
            const snippet = intent
              ? intent
                  .split('\n')
                  .filter(Boolean)
                  .slice(0, 6)
                  .join('\n')
                  .slice(0, 600)
              : ''
            const intentBlock = intent
              ? snippet
                  .split('\n')
                  .map((line) => `> ${line}`)
                  .join('\n')
              : '_No intent provided in the PR description._'

            const lowerIntent = intent.toLowerCase()
            const missingCoverage = intent
              ? Array.from(directories.keys())
                  .filter((dir) => dir !== '(root)')
                  .filter((dir) => !lowerIntent.includes(dir.toLowerCase()))
              : []

            let coverageSection = ''
            if (!intent) {
              coverageSection =
                'PR description is empty, so Codex cannot compare the stated intent to the implementation.'
            } else if (missingCoverage.length === 0) {
              coverageSection = 'Intent references the major impacted areas ✅'
            } else {
              coverageSection = `Intent never mentions: ${missingCoverage
                .map((dir) => `\`${dir}\``)
                .join(', ')}. Consider updating the description for reviewers.`
            }

            // Fetch CI workflow status for this commit
            const workflows = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: process.env.HEAD_SHA,
              per_page: 10,
            })
            
            const ciRun = workflows.data.workflow_runs.find(run => run.name === 'CI')
            const ciStatus = ciRun ? ciRun.conclusion || ciRun.status : 'pending'
            const ciUrl = ciRun ? ciRun.html_url : ''
            
            const formatCiStatus = (status) => {
              if (status === 'success') return `✅ Passed`
              if (status === 'failure') return `❌ Failed`
              if (status === 'in_progress' || status === 'queued' || status === 'pending') return `⏳ Running`
              if (status === 'cancelled') return `⚠️ Cancelled`
              return `⚠️ Not found`
            }
            
            const ciRow = ciUrl 
              ? `| [CI Checks](${ciUrl}) | ${formatCiStatus(ciStatus)} |`
              : `| CI Checks | ${formatCiStatus(ciStatus)} |`

            const trigger =
              process.env.EVENT_NAME === 'issue_comment'
                ? `Manual review requested by @${process.env.COMMENT_AUTHOR || 'unknown'}`
                : `Automatic review on \`${process.env.EVENT_ACTION || 'pull_request'}\``

            const body = `${marker}
            ## 🤖 Codex Review
            **Trigger:** ${trigger}
            **Author:** @${pr.user?.login}

            ### Intent
            ${intentBlock}

            ### Change Summary
            - ${pr.changed_files} files touched (${pr.additions} additions / ${pr.deletions} deletions)
            - Base → Head: \`${pr.base.label}\` ➜ \`${pr.head.label}\`

            ### Impacted Areas
            ${impactedAreas}

            ### Intent vs. Changes
            ${coverageSection}

            ### Automated Checks
            | Check | Result |
            | --- | --- |
            ${ciRow}

            _Reply with \`@codex\` after pushing new commits to queue another review._`
              .replace(/^[ \t]+/gm, '')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            })

            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }
