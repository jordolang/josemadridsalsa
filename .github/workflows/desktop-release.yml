name: Desktop Apps

permissions:
  contents: write

on:
  # Cutting a desktop build is a deliberate act, not something every push should do.
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the desktop shell
        run: |
          npm run lint --workspace=@jose-madrid/windows-admin
          npm run type-check --workspace=@jose-madrid/windows-admin
          npm run test --workspace=@jose-madrid/windows-admin

      # Produces the NSIS installer plus latest.yml, which is the update feed the
      # installed app reads. Both have to reach the release for updates to work.
      #
      # Signed when a code-signing certificate is configured: WINDOWS_CSC_LINK (the
      # .pfx, base64) and WINDOWS_CSC_KEY_PASSWORD. Without them the installer is
      # unsigned and Windows shows a SmartScreen prompt on first install. The
      # variables are only exported when set, so an unsigned build stays unsigned
      # rather than failing on an empty certificate.
      - name: Build installer
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CSC_LINK" ]; then
            export CSC_LINK="$WINDOWS_CSC_LINK" CSC_KEY_PASSWORD="$WINDOWS_CSC_KEY_PASSWORD"
            echo "Signing with the configured certificate"
          else
            echo "::warning::No WINDOWS_CSC_LINK secret — building an unsigned installer"
          fi
          npm run dist:win --workspace=@jose-madrid/windows-admin

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/windows-admin/release/*.exe
            apps/windows-admin/release/*.blockmap
            apps/windows-admin/release/latest.yml
          if-no-files-found: error
          # Only the `publish` job below consumes this, in the same run; the
          # installer itself then lives on the GitHub Release. Keeping a 111 MB
          # artifact for the 90-day default filled the account's storage quota.
          # Three days rather than one: `publish` needs both platforms, and each
          # artifact's clock starts at its own upload, so a macOS runner queued
          # behind a finished Windows build must not outlive the installer.
          retention-days: 3

  macos:
    name: macOS app
    # A full Xcode toolchain is required: the SwiftUI macro plugins that @State
    # expands through are absent from the standalone Command Line Tools.
    runs-on: macos-15
    # Developer ID signing and notarisation run when their secrets exist:
    # MACOS_CERT_P12 (the Developer ID Application certificate, base64) and
    # MACOS_CERT_PASSWORD; APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (an
    # app-specific password) for the notary. Without them the app is ad-hoc
    # signed, as it always has been.
    env:
      HAVE_MAC_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: swift --version

      - name: Import signing certificate
        if: env.HAVE_MAC_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then echo "::error::No Developer ID Application identity in MACOS_CERT_P12"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app bundle
        working-directory: apps/macos-admin
        run: ./build-app.sh

      - name: Package disk image
        working-directory: apps/macos-admin
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          hdiutil create \
            -volname "Jose Madrid Salsa Admin" \
            -srcfolder "dist/Jose Madrid Salsa Admin.app" \
            -ov -format UDZO \
            "dist/JoseMadridSalsaAdmin-${VERSION}.dmg"
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --sign "$MACOS_SIGN_IDENTITY" --timestamp "dist/JoseMadridSalsaAdmin-${VERSION}.dmg"
          fi

      - name: Notarise disk image
        if: env.HAVE_MAC_CERT == 'true' && env.HAVE_NOTARY == 'true'
        working-directory: apps/macos-admin
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apps/macos-admin/dist/*.dmg
          if-no-files-found: error
          # Same handoff, and the same cross-platform wait, as the Windows
          # installer above.
          retention-days: 3

  publish:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.blockmap' -o -name 'latest.yml' \) \
            -exec cp {} release/ \;
          ls -la release

      # One rolling tag holds the current installers. The app's update feed points
      # at this tag by name, so it cannot be shadowed by a platform release.
      #
      # The release is recreated rather than re-uploaded into. `--clobber` deletes
      # the previous asset before writing the new one, and GitHub's immutable
      # releases refuse that with "Cannot delete asset from an immutable release",
      # which failed every rebuild after the first. Deleting the release and its
      # tag, then creating both again, keeps the tag name — and so the download
      # URL the update feed is built from — exactly as it was.
      - name: Publish to the rolling desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release delete desktop-latest --yes --cleanup-tag
          fi
          gh release create desktop-latest release/* \
            --title "Desktop Apps (latest)" \
            --notes "Windows installer and macOS app for the Jose Madrid Salsa admin panel. Rebuilt by the Desktop Apps workflow; always holds the current build."

      # What the installed apps actually read. The GitHub release above is the
      # archive; the repository is private, so an app with no GitHub session
      # gets 404 from it and could never update. Fails loudly without its token,
      # because a build the apps cannot see is not released.
      - name: Publish the update feed
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::BLOB_READ_WRITE_TOKEN is not set — installed apps will not see this build"
            exit 1
          fi
          npm install --prefix .github/scripts --no-save --no-package-lock @vercel/blob@2.4.0
          node .github/scripts/publish-desktop-updates.mjs release

      # A tagged run additionally keeps a fixed copy of that build.
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "Desktop Apps ${GITHUB_REF_NAME}" \
            --notes "Windows installer and macOS app for the Jose Madrid Salsa admin panel."
