name: Desktop Apps

permissions:
  contents: write

on:
  # Cutting a desktop build is a deliberate act, not something every push should do.
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  # The rolling release is opened once, up front, and each build uploads its own
  # files straight into it. Artifact storage is deliberately not used: it is an
  # account-wide quota shared with every other repository, and when it fills the
  # builds still pass while the uploads fail — two green jobs and no installer.
  prepare:
    name: Open the rolling release
    runs-on: ubuntu-latest

    steps:
      - name: Recreate desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Deleted and recreated rather than emptied: `--clobber` deletes each
          # asset first, and GitHub refuses that on an immutable release. A
          # rolling tag is disposable by definition.
          #
          # The tag itself is left alone. Removing it too (--cleanup-tag) and
          # immediately recreating a release on the same name raced GitHub's own
          # bookkeeping and came back 422; keeping the tag means the new release
          # just attaches to a ref that never went away. --target only applies
          # when the tag is genuinely absent, which is the first run after a
          # cleanup.
          gh release delete desktop-latest --yes 2>/dev/null || true
          gh release create desktop-latest \
            --target "${GITHUB_SHA}" \
            --title "Desktop Apps (latest)" \
            --notes "Windows installer and macOS app for the Jose Madrid Salsa admin panel. Rebuilt by the Desktop Apps workflow; always holds the current build."

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the desktop shell
        run: |
          npm run lint --workspace=@jose-madrid/windows-admin
          npm run type-check --workspace=@jose-madrid/windows-admin
          npm run test --workspace=@jose-madrid/windows-admin

      # Produces the NSIS installer plus latest.yml, which is the update feed the
      # installed app reads. Both have to reach the release for updates to work.
      - name: Build installer
        run: npm run dist:win --workspace=@jose-madrid/windows-admin

      - name: Upload installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload desktop-latest \
            apps/windows-admin/release/*.exe \
            apps/windows-admin/release/*.blockmap \
            apps/windows-admin/release/latest.yml \
            --clobber

  macos:
    name: macOS app
    needs: prepare
    # A full Xcode toolchain is required: the SwiftUI macro plugins that @State
    # expands through are absent from the standalone Command Line Tools. This is
    # also why the disk image cannot be built on a machine that only has the
    # Command Line Tools — running this workflow is the way to get one there.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: swift --version

      # build-app.sh produces both the bundle and the disk image, so the
      # artifact a release ships is byte-for-byte what a developer gets
      # locally. It used to be packaged here instead, from the .app alone —
      # which made an image with nothing to drag the app *to*.
      - name: Build app bundle and disk image
        working-directory: apps/macos-admin
        run: ./build-app.sh

      - name: Upload disk image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload desktop-latest apps/macos-admin/dist/*.dmg --clobber

  # A tagged run additionally keeps a fixed copy of the build under that tag.
  tagged:
    name: Tagged copy
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest

    steps:
      # Taken back off the rolling release the two builds just filled, rather
      # than rebuilt, so the tagged copy is the identical binary.
      - name: Copy the rolling release under the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          gh release download desktop-latest --dir release
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "Desktop Apps ${GITHUB_REF_NAME}" \
            --notes "Windows installer and macOS app for the Jose Madrid Salsa admin panel."
