name: Desktop Apps

permissions:
  contents: write

on:
  # Cutting a desktop build is a deliberate act, not something every push should do.
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the desktop shell
        run: |
          npm run lint --workspace=@jose-madrid/windows-admin
          npm run type-check --workspace=@jose-madrid/windows-admin
          npm run test --workspace=@jose-madrid/windows-admin

      # Produces the NSIS installer plus latest.yml, which is the update feed the
      # installed app reads. Both have to reach the release for updates to work.
      - name: Build installer
        run: npm run dist:win --workspace=@jose-madrid/windows-admin

      # Uploaded straight to a release rather than to actions/upload-artifact.
      # That quota is shared across every repository on the account; when it
      # fills, the build still passes while the upload fails, which is how this
      # workflow reported green builds and shipped nothing for two weeks.
      # Assets are attached at creation, not uploaded afterwards: every release in
      # this repository is created immutable, and an immutable release refuses
      # both new assets and replacements. The tag is pushed by hand beforehand
      # because a ruleset stops the Actions token creating refs, and each
      # platform gets its own release because a release can only be created once
      # — the two runners finish at different times and neither has the other's
      # files without going back through artifact storage.
      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete desktop-windows-20260910 --yes 2>/dev/null || true
          gh release create desktop-windows-20260910 \
            apps/windows-admin/release/*.exe \
            apps/windows-admin/release/*.blockmap \
            apps/windows-admin/release/latest.yml \
            --verify-tag \
            --title "Windows installer (2026-09-10)" \
            --notes "Built by the Desktop Apps workflow."

  macos:
    name: macOS app
    # A full Xcode toolchain is required: the SwiftUI macro plugins that @State
    # expands through are absent from the standalone Command Line Tools.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show toolchain
        run: swift --version

      # build-app.sh produces the bundle *and* the disk image, so a release ships
      # what a developer builds locally. The image used to be assembled here
      # instead, from the .app alone — which mounted with nothing to drag it to.
      - name: Build app bundle and disk image
        working-directory: apps/macos-admin
        run: ./build-app.sh

      # Same reasoning as the Windows job above: created with its asset attached,
      # on a tag pushed by hand.
      - name: Publish the disk image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete desktop-macos-20260910 --yes 2>/dev/null || true
          gh release create desktop-macos-20260910 apps/macos-admin/dist/*.dmg \
            --verify-tag \
            --title "macOS disk image (2026-09-10)" \
            --notes "Built by the Desktop Apps workflow."

  # Both builds upload to the release themselves, so there is nothing left to
  # collect. The rolling `desktop-latest` tag is unusable — it was consumed by an
  # immutable release, GitHub will not let the name be reused, and a ruleset stops
  # Actions recreating the ref. Choosing its replacement also means changing the
  # update feed in apps/windows-admin/electron-builder.yml, which is a decision.
  tagged:
    name: Tagged copy
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest

    steps:
      # Taken back off the build release the two jobs just filled, rather than
      # rebuilt, so the tagged copy is the identical binary.
      - name: Copy the build release under the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          gh release download desktop-macos-20260910 --dir release
          gh release download desktop-windows-20260910 --dir release
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "Desktop Apps ${GITHUB_REF_NAME}" \
            --notes "Windows installer and macOS app for the Jose Madrid Salsa admin panel."
