name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: jms_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure disposable development database
        run: |
          echo "DATABASE_URL=postgresql://postgres:copilot@localhost:5432/jms_copilot" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=postgresql://postgres:copilot@localhost:5432/jms_copilot" >> "$GITHUB_ENV"
          echo "RUN_INTEGRATION_TESTS=true" >> "$GITHUB_ENV"

      - name: Generate Prisma client and initialize database
        run: |
          npm run db:generate
          npm run db:push --workspace=@jose-madrid/storefront
