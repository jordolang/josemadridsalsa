name: CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allows re-running the pipeline on demand without an empty commit.
  workflow_dispatch:

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    # Provision a throwaway Postgres so the integration tests (inventory, checkout
    # reservation, order completion) run for real instead of being skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jms_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/jms_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate the Prisma client and sync the schema to the throwaway Postgres
      # so integration tests have their tables before the suite runs.
      - name: Set up test database
        run: npm run db:push --workspace=@jose-madrid/storefront

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      # The vitest suite is now green (the previous backlog of stale mocks / missing test
      # env vars was fixed, and files run sequentially — fileParallelism: false — which
      # removed the parallel-execution flakiness). This step gates on test pass/fail.
      - name: Run tests
        run: npm run test

      # Coverage is reported (and the thresholds enforced) here but kept non-gating: the
      # global function/branch coverage still sits just under the 60% target, and blocking
      # every PR on that is what got the suite disabled before. Raise coverage, then drop
      # continue-on-error to gate on it too.
      - name: Run tests with coverage (reported, not gating)
        run: npm run test:coverage
        continue-on-error: true
        env:
          CI: true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/storefront/coverage/
            apps/backend/coverage/
            apps/fundraising/coverage/
            apps/admin/coverage/
          retention-days: 30

      # Reporting only — this Jest-oriented action is brittle against the Vitest suite
      # (it crashes on a missing coverage-summary.json). Like the test/e2e steps above it
      # must never gate; without this it aborts the job before build runs, keeping CI red.
      - name: Post coverage report to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          coverage-file: ./apps/storefront/coverage/coverage-summary.json
          base-coverage-file: ./apps/storefront/coverage/coverage-summary.json
          annotations: none
          package-manager: npm
          test-script: npm run test:coverage

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build application
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright's testMatch is **/*.spec.ts but the e2e files are named *.test.ts, so
      # this currently matches nothing and the "e2e" files are actually run by vitest.
      # Reported, not gating, until the suite is renamed and given a database.
      - name: Run Playwright E2E tests (reported, not gating)
        run: npm run test:e2e
        continue-on-error: true
        env:
          CI: true

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/storefront/playwright-report/
          retention-days: 30

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/storefront/.next
            apps/fundraising/.next
            apps/admin/.next
          retention-days: 7
