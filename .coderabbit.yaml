# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit is disabled for this repository.
#
# CodeRabbit runs as a GitHub App, so fully removing it also requires
# uninstalling or de-scoping that app in GitHub org settings
# (Settings -> GitHub Apps -> CodeRabbit -> Configure -> repository access).
# This config turns off its automated reviews and status comments in the
# meantime so it no longer participates in pull requests here.
reviews:
  auto_review:
    enabled: false
  review_status: false
